[game]
binary = "target/release/chessbender"
build_command = "nix develop -c cargo build --release"
project_root = "."
assets_dir = "assets"
listener_log = "fragpipe-listener.log"
joiner_log = "fragpipe-joiner.log"
host_args = ["--headless"]

[[game.env]]
name = "RUST_BACKTRACE"
value = "1"

[webrtc]
local_ip = "127.0.0.1"
port = 27200
timeout_secs = 300
max_runs = 1

