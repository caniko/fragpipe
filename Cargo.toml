[package]
name = "fragpipe"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bare-metal multiplayer test orchestration for games"

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "fragpipe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
png = "0.18"
regex = "1"
rmcp = { version = "1.5", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
toml = "0.8"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[dev-dependencies]
tempfile = "3"
