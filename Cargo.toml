[package]
name = "fragpipe"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bare-metal multiplayer test orchestration for Chessbender"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
