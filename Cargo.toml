[package]
name = "fragpipe"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bare-metal multiplayer test orchestration for games"

[workspace]

[features]
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio", "dep:tracing-subscriber", "dep:mcp-layer", "dep:steampipe", "dep:toml1"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "fragpipe"
path = "src/main.rs"

[[bin]]
name = "fragpipe-mcp"
path = "src/bin/fragpipe-mcp.rs"
required-features = ["mcp"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
rmcp = { version = "=3.10.0", features = ["server", "transport-io"], optional = true }
rustix = { version = "1", features = ["process"] }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std"], optional = true }
toml = "0.8"
toml1 = { package = "toml", version = "1.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"], optional = true }
mcp-layer = { git = "https://github.com/caniko/steampipe", rev = "bd25d71fa6d7cbba57f43d117c27e42025dfda89", optional = true }
steampipe = { git = "https://github.com/caniko/steampipe", rev = "bd25d71fa6d7cbba57f43d117c27e42025dfda89", optional = true }

[dev-dependencies]
tempfile = "3"
