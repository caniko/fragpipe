# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeberg-tiny:
    runs-on: codeberg-tiny
    container: rust:bookworm
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Cache cargo bin (tools)
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-${{ hashFiles('.forgejo/workflows/*.yaml') }}

      - name: Verify compiler cache
        run: |
          set -eu
          test -x /usr/local/bin/sccache
          test -S /run/redis-sccache/redis.sock
          /usr/local/bin/sccache --zero-stats

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Record compiler cache stats
        if: always()
        run: /usr/local/bin/sccache --show-adv-stats || true

  codeberg-medium:
    needs: [codeberg-tiny]
    runs-on: codeberg-medium
    container: rust:bookworm
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Cache cargo bin (tools)
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-${{ hashFiles('.forgejo/workflows/*.yaml') }}

      - name: Verify compiler cache
        run: |
          set -eu
          test -x /usr/local/bin/sccache
          test -S /run/redis-sccache/redis.sock
          /usr/local/bin/sccache --zero-stats

      - name: Test
        run: cargo test

      - name: Package crate
        run: cargo package --allow-dirty --list
      - name: Record compiler cache stats
        if: always()
        run: /usr/local/bin/sccache --show-adv-stats || true

  codeberg-small:
    needs: [codeberg-tiny]
    runs-on: codeberg-small
    container: rust:bookworm
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Cache cargo bin (tools)
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-${{ hashFiles('.forgejo/workflows/*.yaml') }}

      - name: Verify compiler cache
        run: |
          set -eu
          test -x /usr/local/bin/sccache
          test -S /run/redis-sccache/redis.sock
          /usr/local/bin/sccache --zero-stats

      - name: Clippy
        run: cargo clippy --all-targets -- --deny warnings

      - name: Record compiler cache stats
        if: always()
        run: /usr/local/bin/sccache --show-adv-stats || true
