[ci]
push_branches = ["trunk", "simit/update/**"]
runner = "ubuntu-24.04"
step_runners = { cargo-clippy = "ubuntu-24.04", cargo-doc = "ubuntu-24.04", cargo-fmt = "ubuntu-24.04", cargo-package = "ubuntu-24.04", cargo-test = "ubuntu-24.04", quality-tools = "ubuntu-24.04" }
provider = "actions"
platform = "github"
publish_crates = true
runtime = "nix"
publish_strategy = "members"

# Linux closures consumed by canix (via regicide), published to the public
# canix cache on trunk pushes only (secret ATTIC_TOKEN). Pull requests build
# but never push.
[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
system_runners = { x86_64-linux = "ubuntu-24.04" }
nix_builds = [".#packages.x86_64-linux.fragpipe", ".#packages.x86_64-linux.fragpipe-mcp"]
push_branches = ["trunk", "simit/update/**"]

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "fragpipe"
token_secret = "ATTIC_TOKEN"
