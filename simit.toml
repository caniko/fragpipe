[ci]
runner = "codefloe-global"
step_runners = { cargo-clippy = "codeberg-small", cargo-doc = "codeberg-small", cargo-fmt = "codeberg-tiny", cargo-package = "codeberg-medium", cargo-test = "codeberg-medium", quality-tools = "codeberg-small" }
provider = "crow"
platform = "forgejo"
publish_crates = true
runtime = "nix"

# Linux closures consumed by canix (via regicide), published to the public
# canix cache on trunk pushes only (secret ATTIC_TOKEN). Pull requests build
# but never push.
[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
system_runners = { x86_64-linux = "ubuntu-24.04" }
nix_builds = [".#packages.x86_64-linux.fragpipe", ".#packages.x86_64-linux.fragpipe-mcp"]
push_branches = ["trunk"]

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "fragpipe"
token_secret = "ATTIC_TOKEN"
